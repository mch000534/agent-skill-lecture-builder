<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>澳門科學館 · 課程目錄</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/a/ACg8ocKqgHiVygLR36jXlNIMBwJ3L13eCHNm0KEMCwKtcjNAj6BEzgQx=s576-c-no">
  <meta property="og:type" content="website">
  <meta property="og:title" content="澳門科學館 · 課程目錄">
  <meta property="og:description" content="澳門科學館 AI 課程系列，探索生成式 AI 的實務應用與資安防護。">
  <meta property="og:site_name" content="澳門科學館">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f1117;
      --bg-card: #181b25;
      --bg-card-alt: #1e2130;
      --text: #e4e4e7;
      --text-dim: #8b8d9a;
      --accent: #e8845a;
      --accent-rgb: 232 132 90;
      --accent2: #e8b878;
      --accent2-rgb: 232 184 120;
      --border: #2a2d3a;
      --radius: 12px;
    }
    [data-theme="light"] {
      --bg: #f5f5f7;
      --bg-card: #ffffff;
      --bg-card-alt: #f0f0f3;
      --text: #1a1a2e;
      --text-dim: #5a5b6a;
      --accent: #c45c28;
      --accent-rgb: 196 92 40;
      --accent2: #9a7028;
      --accent2-rgb: 154 112 40;
      --border: #d4d4d8;
    }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans TC', sans-serif;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Header ── */
    .site-header {
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      background: rgb(15 17 23 / .92);
      backdrop-filter: blur(12px);
      z-index: 100;
    }
    [data-theme="light"] .site-header {
      background: rgb(245 245 247 / .92);
    }
    .site-logo {
      display: flex;
      align-items: center;
      gap: .75rem;
      text-decoration: none;
      color: var(--text);
    }
    .site-logo img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }
    .site-logo-name {
      font-family: 'Noto Serif TC', serif;
      font-weight: 700;
      font-size: 1rem;
    }
    .theme-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 8px;
      padding: .4rem .75rem;
      cursor: pointer;
      font-size: .85rem;
      transition: border-color .2s, color .2s;
    }
    .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 5rem 2rem 3rem;
      position: relative;
      overflow: clip;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -20%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgb(var(--accent-rgb) / .1) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -20%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgb(var(--accent2-rgb) / .07) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .35rem .9rem;
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: .78rem;
      color: var(--text-dim);
      letter-spacing: .06em;
      margin-bottom: 1.5rem;
    }
    .hero-badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    .hero h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--text) 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding: 0.08em 0.2em 0.16em;
    }
    .hero-sub {
      font-size: clamp(.95rem, 2vw, 1.1rem);
      color: var(--text-dim);
      max-width: 560px;
      margin: 0 auto 1rem;
      font-weight: 300;
    }
    .hero-count {
      font-size: .85rem;
      color: var(--accent);
      font-weight: 500;
      min-height: 1.4em;
    }

    /* ── Grid ── */
    .grid-wrap {
      max-width: min(1080px, 92%);
      margin: 0 auto;
      padding: 2rem 0 6rem;
    }
    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    .empty {
      color: var(--text-dim);
      text-align: center;
      padding: 4rem 0;
      font-size: .95rem;
    }

    /* ── Course Card ── */
    .course-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: var(--text);
      transition: border-color .3s, transform .3s, box-shadow .3s;
    }
    .course-card:hover {
      border-color: rgb(var(--accent-rgb) / .45);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgb(0 0 0 / .25);
    }
    .course-card--no-link {
      opacity: .6;
      cursor: default;
    }
    .course-img {
      width: 100%;
      aspect-ratio: 1200 / 630;
      overflow: hidden;
      background: var(--bg-card-alt);
    }
    .course-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s ease;
    }
    .course-card:hover .course-img img {
      transform: scale(1.03);
    }
    .course-img--placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .course-img--placeholder span {
      font-family: 'Noto Serif TC', serif;
      font-size: 3rem;
      font-weight: 900;
      color: rgb(var(--accent-rgb) / .3);
    }
    .course-body {
      padding: 1.4rem 1.5rem 1.75rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .course-badge {
      font-size: .72rem;
      color: var(--accent);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: .6rem;
      font-weight: 500;
    }
    .course-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: .65rem;
    }
    .course-desc {
      font-size: .88rem;
      color: var(--text-dim);
      line-height: 1.65;
      flex: 1;
      margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .course-cta {
      font-size: .82rem;
      color: var(--accent2);
      font-weight: 500;
      transition: color .2s;
    }
    .course-card:hover .course-cta { color: var(--accent); }

    /* ── Footer ── */
    .site-footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 2rem;
      font-size: .82rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

<header class="site-header">
  <a href="./" class="site-logo">
    <img src="https://lh3.googleusercontent.com/a/ACg8ocKqgHiVygLR36jXlNIMBwJ3L13eCHNm0KEMCwKtcjNAj6BEzgQx=s576-c-no" alt="澳門科學館">
    <span class="site-logo-name">澳門科學館</span>
  </a>
  <button class="theme-btn" onclick="toggleTheme()" aria-label="切換主題">&#9728; / &#9790;</button>
</header>

<section class="hero">
  <div class="hero-badge"><span class="dot"></span>AI 課程系列</div>
  <h1>課程目錄</h1>
  <p class="hero-sub">探索生成式 AI 的實務應用與資安防護，與澳門科學館一同踏入 AI 新時代。</p>
  <p class="hero-count" id="hero-count"></p>
</section>

<div class="grid-wrap">
  <p class="empty" id="empty-msg" hidden>尚無課程，請將課程資料夾放入 <code>lectures/</code> 目錄並執行 <code>node build-index.mjs</code>。</p>
  <div class="course-grid" id="course-grid"></div>
</div>

<footer class="site-footer">
  <p>&#169; 澳門科學館</p>
</footer>

<script>window.__courses__ = null;</script>
<script src="lectures/manifest.js" onerror="window.__courses__ = [];"></script>
<script>
  (function () {
    const saved = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();

  function toggleTheme() {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
    localStorage.setItem('theme', isLight ? 'dark' : 'light');
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function buildCard(l) {
    const firstChar = esc((l.title || '?').charAt(0));
    const placeholder = '<div class="course-img course-img--placeholder"><span>' + firstChar + '</span></div>';
    const imgTag = l.ogImage
      ? '<div class="course-img"><img src="' + esc(l.ogImage) + '" alt="' + esc(l.title) + '" loading="lazy" onerror="this.parentElement.outerHTML=\'<div class=&quot;course-img course-img--placeholder&quot;><span>' + firstChar + '</span></div>\'"></div>'
      : placeholder;

    const inner = imgTag +
      '<div class="course-body">' +
      (l.badge ? '<p class="course-badge">' + esc(l.badge) + '</p>' : '') +
      '<h2 class="course-title">' + esc(l.title) + '</h2>' +
      (l.subtitle ? '<p class="course-desc">' + esc(l.subtitle) + '</p>' : '') +
      '<span class="course-cta">&#31435;&#21363;&#23416;&#32722; &#8594;</span>' +
      '</div>';

    if (l.href) {
      return '<a href="' + esc(l.href) + '" class="course-card">' + inner + '</a>';
    }
    return '<div class="course-card course-card--no-link">' + inner + '</div>';
  }

  function renderCourses(courses) {
    var countEl = document.getElementById('hero-count');
    var gridEl = document.getElementById('course-grid');
    var emptyEl = document.getElementById('empty-msg');
    countEl.textContent = courses.length + ' 門課程';
    if (!courses.length) { emptyEl.hidden = false; return; }
    gridEl.innerHTML = courses.map(buildCard).join('');
  }

  renderCourses(window.__courses__ || []);
</script>
</body>
</html>
