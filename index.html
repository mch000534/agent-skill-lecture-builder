  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f1117;
      --bg-card: #181b25;
      --bg-card-alt: #1e2130;
      --text: #e4e4e7;
      --text-dim: #8b8d9a;
      --accent: #e8845a;
      --accent-rgb: 232 132 90;
      --accent2: #e8b878;
      --accent2-rgb: 232 184 120;
      --border: #2a2d3a;
      --radius: 12px;
    }
    [data-theme="light"] {
      --bg: #f5f5f7;
      --bg-card: #ffffff;
      --bg-card-alt: #f0f0f3;
      --text: #1a1a2e;
      --text-dim: #5a5b6a;
      --accent: #c45c28;
      --accent-rgb: 196 92 40;
      --accent2: #9a7028;
      --accent2-rgb: 154 112 40;
      --border: #d4d4d8;
    }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans TC', sans-serif;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Header ── */
    .site-header {
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      background: rgb(15 17 23 / .92);
      backdrop-filter: blur(12px);
      z-index: 100;
    }
    [data-theme="light"] .site-header {
      background: rgb(245 245 247 / .92);
    }
    .site-logo {
      display: flex;
      align-items: center;
      gap: .75rem;
      text-decoration: none;
      color: var(--text);
    }
    .site-logo img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }
    .site-logo-name {
      font-family: 'Noto Serif TC', serif;
      font-weight: 700;
      font-size: 1rem;
    }
    .theme-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 8px;
      padding: .4rem .75rem;
      cursor: pointer;
      font-size: .85rem;
      transition: border-color .2s, color .2s;
    }
    .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 5rem 2rem 3rem;
      position: relative;
      overflow: clip;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -20%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgb(var(--accent-rgb) / .1) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -20%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgb(var(--accent2-rgb) / .07) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .35rem .9rem;
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: .78rem;
      color: var(--text-dim);
      letter-spacing: .06em;
      margin-bottom: 1.5rem;
    }
    .hero-badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    .hero h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--text) 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding: 0.08em 0.2em 0.16em;
    }
    .hero-sub {
      font-size: clamp(.95rem, 2vw, 1.1rem);
      color: var(--text-dim);
      max-width: 560px;
      margin: 0 auto 1rem;
      font-weight: 300;
    }
    .hero-count {
      font-size: .85rem;
      color: var(--accent);
      font-weight: 500;
    }

    /* ── Grid ── */
    .grid-wrap {
      max-width: min(1080px, 92%);
      margin: 0 auto;
      padding: 2rem 0 6rem;
    }
    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    .empty {
      color: var(--text-dim);
      text-align: center;
      padding: 4rem 0;
      font-size: .95rem;
    }

    /* ── Course Card ── */
    .course-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: var(--text);
      transition: border-color .3s, transform .3s, box-shadow .3s;
    }
    .course-card:hover {
      border-color: rgb(var(--accent-rgb) / .45);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgb(0 0 0 / .25);
    }
    .course-card--no-link {
      opacity: .6;
      cursor: default;
    }
    .course-img {
      width: 100%;
      aspect-ratio: 1200 / 630;
      overflow: hidden;
      background: var(--bg-card-alt);
    }
    .course-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s ease;
    }
    .course-card:hover .course-img img {
      transform: scale(1.03);
    }
    .course-img--placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .course-img--placeholder span {
      font-family: 'Noto Serif TC', serif;
      font-size: 3rem;
      font-weight: 900;
      color: rgb(var(--accent-rgb) / .3);
    }
    .course-body {
      padding: 1.4rem 1.5rem 1.75rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .course-badge {
      font-size: .72rem;
      color: var(--accent);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: .6rem;
      font-weight: 500;
    }
    .course-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: .65rem;
    }
    .course-desc {
      font-size: .88rem;
      color: var(--text-dim);
      line-height: 1.65;
      flex: 1;
      margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .course-cta {
      font-size: .82rem;
      color: var(--accent2);
      font-weight: 500;
      transition: color .2s;
    }
    .course-card:hover .course-cta { color: var(--accent); }

    /* ── Footer ── */
    .site-footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 2rem;
      font-size: .82rem;
      color: var(--text-dim);
    }
  </style>
</head>

<script>
  (function () {
    const saved = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();

  function toggleTheme() {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
    localStorage.setItem('theme', isLight ? 'dark' : 'light');
  }
