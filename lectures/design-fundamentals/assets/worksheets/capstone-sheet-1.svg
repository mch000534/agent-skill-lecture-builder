<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 1123 794" role="img" aria-label="城市創意節整合練習第1張，包含海報、PPT與設計規則草圖欄">
  <rect width="1123" height="794" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#18243d">
    <text x="40" y="44" font-size="28" font-weight="800">城市創意節整合練習　第1張</text>
    <text x="1083" y="42" text-anchor="end" font-size="14">姓名：　　　　　　　　　日期：　　　　　　</text>
    <text x="40" y="68" font-size="13" fill="#4d586b">先定義對象與目標，再用同一套規則完成海報與簡報草圖。</text>

    <rect x="40" y="84" width="505" height="62" rx="8" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <text x="56" y="108" font-size="15" font-weight="800">主要使用者</text>
    <line x1="56" y1="130" x2="529" y2="130" stroke="#647084" stroke-width="1.4" stroke-dasharray="6 5"/>
    <rect x="565" y="84" width="518" height="62" rx="8" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <text x="581" y="108" font-size="15" font-weight="800">溝通目標</text>
    <line x1="581" y1="130" x2="1067" y2="130" stroke="#647084" stroke-width="1.4" stroke-dasharray="6 5"/>

    <text x="40" y="177" font-size="17" font-weight="800">活動海報草圖</text>
    <text x="324" y="177" text-anchor="end" font-size="12" fill="#4d586b">75 × 105 mm</text>
    <rect x="40" y="190" width="284" height="397" fill="#ffffff" stroke="#18243d" stroke-width="2.4"/>
    <line x1="54" y1="222" x2="310" y2="222" stroke="#aab0bb" stroke-width="1" stroke-dasharray="5 5"/>
    <text x="182" y="211" text-anchor="middle" font-size="11" fill="#647084">主標題區</text>
    <line x1="54" y1="522" x2="310" y2="522" stroke="#aab0bb" stroke-width="1" stroke-dasharray="5 5"/>
    <text x="182" y="546" text-anchor="middle" font-size="11" fill="#647084">日期、地點、行動資訊</text>
    <path d="M40 190l18 0M40 190l0 18M324 190l-18 0M324 190l0 18M40 587l18 0M40 587l0-18M324 587l-18 0M324 587l0-18" fill="none" stroke="#18243d" stroke-width="3"/>

    <text x="355" y="177" font-size="17" font-weight="800">PPT 主視覺草圖</text>
    <text x="839" y="177" text-anchor="end" font-size="12" fill="#4d586b">128 × 72 mm｜16:9</text>
    <rect x="355" y="190" width="484" height="272" fill="#ffffff" stroke="#18243d" stroke-width="2.4"/>
    <line x1="371" y1="242" x2="823" y2="242" stroke="#aab0bb" stroke-width="1" stroke-dasharray="5 5"/>
    <text x="371" y="224" font-size="11" fill="#647084">一句結論</text>
    <rect x="371" y="272" width="172" height="105" rx="5" fill="none" stroke="#aab0bb" stroke-width="1.2" stroke-dasharray="7 5"/>
    <text x="457" y="329" text-anchor="middle" font-size="11" fill="#647084">關鍵數字或圖像</text>
    <line x1="571" y1="292" x2="808" y2="292" stroke="#aab0bb" stroke-width="1.2" stroke-dasharray="7 5"/>
    <line x1="571" y1="326" x2="808" y2="326" stroke="#aab0bb" stroke-width="1.2" stroke-dasharray="7 5"/>
    <line x1="571" y1="360" x2="808" y2="360" stroke="#aab0bb" stroke-width="1.2" stroke-dasharray="7 5"/>

    <rect x="865" y="190" width="218" height="272" rx="8" fill="#f7f4ee" stroke="#18243d" stroke-width="2"/>
    <text x="881" y="218" font-size="16" font-weight="800">跨媒介一致性檢查</text>
    <g font-size="13">
      <rect x="881" y="240" width="14" height="14" fill="#ffffff" stroke="#18243d" stroke-width="1.5"/>
      <text x="907" y="252">活動名稱一致</text>
      <rect x="881" y="274" width="14" height="14" fill="#ffffff" stroke="#18243d" stroke-width="1.5"/>
      <text x="907" y="286">主要訊息一致</text>
      <rect x="881" y="308" width="14" height="14" fill="#ffffff" stroke="#18243d" stroke-width="1.5"/>
      <text x="907" y="320">色彩與字體一致</text>
      <rect x="881" y="342" width="14" height="14" fill="#ffffff" stroke="#18243d" stroke-width="1.5"/>
      <text x="907" y="354">行動文字一致</text>
    </g>
    <text x="881" y="391" font-size="13" font-weight="800">這一頁最重要的是：</text>
    <line x1="881" y1="416" x2="1067" y2="416" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>
    <line x1="881" y1="442" x2="1067" y2="442" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>

    <rect x="355" y="490" width="728" height="218" rx="10" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <text x="375" y="518" font-size="17" font-weight="800">最小設計系統</text>
    <line x1="594" y1="510" x2="594" y2="690" stroke="#c4c8d0" stroke-width="1.2"/>
    <line x1="817" y1="510" x2="817" y2="690" stroke="#c4c8d0" stroke-width="1.2"/>

    <text x="375" y="550" font-size="14" font-weight="800">色彩規則</text>
    <g fill="#ffffff" stroke="#18243d" stroke-width="1.5">
      <rect x="375" y="566" width="28" height="28" rx="4"/>
      <rect x="421" y="566" width="28" height="28" rx="4"/>
      <rect x="467" y="566" width="28" height="28" rx="4"/>
      <rect x="513" y="566" width="28" height="28" rx="4"/>
    </g>
    <text x="375" y="618" font-size="12">主色用途：</text>
    <line x1="375" y1="638" x2="574" y2="638" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="375" y="664" font-size="12">強調色用途：</text>
    <line x1="375" y1="684" x2="574" y2="684" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>

    <text x="614" y="550" font-size="14" font-weight="800">字級規則</text>
    <text x="614" y="580" font-size="12">大標題：</text>
    <line x1="675" y1="583" x2="797" y2="583" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="614" y="616" font-size="12">小標題：</text>
    <line x1="675" y1="619" x2="797" y2="619" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="614" y="652" font-size="12">內　文：</text>
    <line x1="675" y1="655" x2="797" y2="655" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="614" y="688" font-size="12">字　重：</text>
    <line x1="675" y1="691" x2="797" y2="691" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>

    <text x="837" y="550" font-size="14" font-weight="800">間距與元件規則</text>
    <text x="837" y="580" font-size="12">間距基準：</text>
    <line x1="908" y1="583" x2="1063" y2="583" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="837" y="616" font-size="12">按鈕樣式：</text>
    <line x1="908" y1="619" x2="1063" y2="619" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="837" y="652" font-size="12">卡片樣式：</text>
    <line x1="908" y1="655" x2="1063" y2="655" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="837" y="688" font-size="12">圓角／線條：</text>
    <line x1="922" y1="691" x2="1063" y2="691" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>

    <line x1="40" y1="742" x2="1083" y2="742" stroke="#18243d" stroke-width="1"/>
    <text x="40" y="766" font-size="12">完成標準：低保真草圖可辨識、資訊層級清楚、能說明每個設計決策。</text>
    <text x="1083" y="766" text-anchor="end" font-size="12" font-weight="700">設計入門｜整合練習</text>
  </g>
</svg>
