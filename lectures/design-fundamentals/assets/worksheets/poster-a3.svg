<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 1123 1587" role="img" aria-label="校園公開講座 A3 直式海報低保真工作紙">
  <rect width="1123" height="1587" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#18243d">
    <text x="40" y="48" font-size="29" font-weight="800">校園公開講座｜A3 海報低保真工作紙</text>
    <text x="1083" y="45" text-anchor="end" font-size="14">姓名：　　　　　　　　　日期：　　　　　　</text>
    <rect x="40" y="65" width="1043" height="34" rx="7" fill="#f7f4ee" stroke="#18243d" stroke-width="1.5"/>
    <text x="56" y="87" font-size="13" font-weight="800">交付標準：黑白低保真、只做資訊層級與閱讀動線；不需精修、不畫插圖、不製作可掃描 QR Code。</text>

    <rect x="40" y="118" width="1043" height="316" rx="10" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <text x="58" y="146" font-size="18" font-weight="800">完整散亂素材清單</text>
    <text x="1065" y="145" text-anchor="end" font-size="12" fill="#4d586b">先圈出三秒內必須看到的資訊，再分成三層</text>
    <line x1="555" y1="158" x2="555" y2="417" stroke="#c4c8d0" stroke-width="1.2"/>
    <g font-size="12.5">
      <text x="58" y="177" font-weight="800">活動名</text>
      <text x="123" y="177">設計如何解決真實問題：從觀察到行動</text>
      <text x="58" y="207" font-weight="800">活動性質</text>
      <text x="123" y="207">校園創意公開講座 2026</text>
      <text x="58" y="237" font-weight="800">講者</text>
      <text x="123" y="237">林子安，Fieldnote Design 共同創辦人、服務設計顧問</text>
      <text x="58" y="267" font-weight="800">日期</text>
      <text x="123" y="267">2026 年 9 月 24 日，星期四</text>
      <text x="58" y="297" font-weight="800">時間</text>
      <text x="123" y="297">19:00–20:30，18:30 開放入場</text>
      <text x="58" y="327" font-weight="800">地點</text>
      <text x="123" y="327">創新大樓 2 樓演講廳 A201</text>
      <text x="58" y="357" font-weight="800">活動簡介</text>
      <text x="123" y="357">從校園與城市案例出發，示範觀察使用者、定義問題、提出可測試方案，</text>
      <text x="123" y="378">並分享設計師與非設計背景團隊合作的方法。</text>
      <text x="58" y="408" font-weight="800">適合對象</text>
      <text x="123" y="408">全校學生、社團幹部、專題團隊與對設計思維有興趣者</text>

      <text x="575" y="177" font-weight="800">費用與名額</text>
      <text x="665" y="177">免費入場，限額 120 人，額滿即止</text>
      <text x="575" y="207" font-weight="800">報名截止</text>
      <text x="665" y="207">2026 年 9 月 21 日 23:59</text>
      <text x="575" y="237" font-weight="800">行動文字</text>
      <text x="665" y="237">立即掃描 QR Code 報名</text>
      <text x="575" y="267" font-weight="800">報名短網址</text>
      <text x="665" y="267">design.example.edu/talk</text>
      <text x="575" y="297" font-weight="800">主辦單位</text>
      <text x="665" y="297">大學創新中心</text>
      <text x="575" y="327" font-weight="800">合作單位</text>
      <text x="665" y="327">學生設計學會、職涯發展處</text>
      <text x="575" y="357" font-weight="800">備註</text>
      <text x="665" y="357">完成報名後將寄發確認信；如需無障礙座位，</text>
      <text x="665" y="378">請於表單中勾選。</text>
    </g>

    <text x="40" y="468" font-size="18" font-weight="800">三個縮圖｜每格只畫焦點、分組與閱讀順序</text>
    <text x="225" y="495" text-anchor="middle" font-size="13" font-weight="800">方案 A</text>
    <rect x="133" y="508" width="184" height="260" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <line x1="147" y1="548" x2="303" y2="548" stroke="#aab0bb" stroke-width="1.1" stroke-dasharray="6 5"/>
    <line x1="147" y1="694" x2="303" y2="694" stroke="#aab0bb" stroke-width="1.1" stroke-dasharray="6 5"/>
    <text x="438" y="495" text-anchor="middle" font-size="13" font-weight="800">方案 B</text>
    <rect x="346" y="508" width="184" height="260" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <rect x="360" y="528" width="156" height="78" rx="4" fill="none" stroke="#aab0bb" stroke-width="1.1" stroke-dasharray="6 5"/>
    <line x1="360" y1="650" x2="516" y2="650" stroke="#aab0bb" stroke-width="1.1" stroke-dasharray="6 5"/>
    <text x="651" y="495" text-anchor="middle" font-size="13" font-weight="800">方案 C</text>
    <rect x="559" y="508" width="184" height="260" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <line x1="651" y1="522" x2="651" y2="754" stroke="#aab0bb" stroke-width="1.1" stroke-dasharray="6 5"/>
    <line x1="573" y1="584" x2="729" y2="584" stroke="#aab0bb" stroke-width="1.1" stroke-dasharray="6 5"/>

    <rect x="770" y="508" width="313" height="260" rx="8" fill="#f7f4ee" stroke="#18243d" stroke-width="2"/>
    <text x="788" y="537" font-size="16" font-weight="800">縮圖比較</text>
    <text x="788" y="570" font-size="12">第一眼看到：</text>
    <line x1="875" y1="573" x2="1065" y2="573" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>
    <text x="788" y="607" font-size="12">閱讀順序：</text>
    <line x1="863" y1="610" x2="1065" y2="610" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>
    <text x="788" y="644" font-size="12">選用方案：</text>
    <line x1="863" y1="647" x2="1065" y2="647" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>
    <text x="788" y="681" font-size="12">理由：</text>
    <line x1="833" y1="684" x2="1065" y2="684" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>
    <line x1="788" y1="723" x2="1065" y2="723" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>

    <g transform="translate(0 -25)">
    <text x="40" y="814" font-size="18" font-weight="800">主要 A3 版面框｜依選定縮圖完成黑白低保真配置</text>
    <text x="570" y="813" text-anchor="end" font-size="12" fill="#4d586b">比例 297 × 420 mm</text>
    <rect x="40" y="830" width="530" height="749" fill="#ffffff" stroke="#18243d" stroke-width="2.6"/>
    <line x1="58" y1="892" x2="552" y2="892" stroke="#aab0bb" stroke-width="1.1" stroke-dasharray="7 6"/>
    <text x="305" y="879" text-anchor="middle" font-size="11" fill="#4d586b">主訊息與日期優先區</text>
    <line x1="58" y1="1425" x2="552" y2="1425" stroke="#aab0bb" stroke-width="1.1" stroke-dasharray="7 6"/>
    <text x="305" y="1450" text-anchor="middle" font-size="11" fill="#4d586b">CTA、短網址與 QR Code 行動區</text>
    <path d="M40 830h22M40 830v22M570 830h-22M570 830v22M40 1579h22M40 1579v-22M570 1579h-22M570 1579v-22" fill="none" stroke="#18243d" stroke-width="3"/>

    <rect x="600" y="830" width="483" height="164" rx="9" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <text x="618" y="859" font-size="16" font-weight="800">字級與字重註記</text>
    <text x="618" y="892" font-size="12">活動名　字級：</text>
    <line x1="715" y1="895" x2="804" y2="895" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>
    <text x="825" y="892" font-size="12">字重：</text>
    <line x1="869" y1="895" x2="1065" y2="895" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>
    <text x="618" y="929" font-size="12">日期地點字級：</text>
    <line x1="715" y1="932" x2="804" y2="932" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>
    <text x="825" y="929" font-size="12">字重：</text>
    <line x1="869" y1="932" x2="1065" y2="932" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>
    <text x="618" y="966" font-size="12">內文字級：</text>
    <line x1="690" y1="969" x2="804" y2="969" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>
    <text x="825" y="966" font-size="12">字重：</text>
    <line x1="869" y1="969" x2="1065" y2="969" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>

    <rect x="600" y="1012" width="483" height="146" rx="9" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <text x="618" y="1041" font-size="16" font-weight="800">色彩用途註記</text>
    <rect x="618" y="1062" width="34" height="34" rx="5" fill="#ffffff" stroke="#18243d" stroke-width="1.5"/>
    <text x="666" y="1084" font-size="12">主色：</text>
    <line x1="707" y1="1087" x2="1065" y2="1087" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>
    <rect x="618" y="1110" width="34" height="34" rx="5" fill="#ffffff" stroke="#18243d" stroke-width="1.5"/>
    <text x="666" y="1132" font-size="12">強調色：</text>
    <line x1="719" y1="1135" x2="1065" y2="1135" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>

    <rect x="600" y="1176" width="483" height="154" rx="9" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <text x="618" y="1205" font-size="16" font-weight="800">QR Code 位置註記</text>
    <rect x="618" y="1222" width="82" height="82" fill="#ffffff" stroke="#18243d" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="659" y="1268" text-anchor="middle" font-size="11">QR 預留區</text>
    <text x="724" y="1239" font-size="12">放置位置：</text>
    <line x1="795" y1="1242" x2="1065" y2="1242" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>
    <text x="724" y="1276" font-size="12">CTA 文字：</text>
    <line x1="795" y1="1279" x2="1065" y2="1279" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>
    <text x="724" y="1310" font-size="11" fill="#4d586b">只標位置，不需產生或測試真實 QR Code。</text>

    <rect x="600" y="1348" width="483" height="231" rx="9" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <text x="618" y="1377" font-size="16" font-weight="800">三秒測試與修正</text>
    <text x="618" y="1410" font-size="12">同伴先看到：</text>
    <line x1="705" y1="1413" x2="1065" y2="1413" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>
    <text x="618" y="1447" font-size="12">同伴記得：</text>
    <line x1="693" y1="1450" x2="1065" y2="1450" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>
    <text x="618" y="1484" font-size="12">是否找到報名入口：</text>
    <rect x="744" y="1471" width="15" height="15" fill="#ffffff" stroke="#18243d" stroke-width="1.4"/>
    <text x="767" y="1484" font-size="12">是</text>
    <rect x="806" y="1471" width="15" height="15" fill="#ffffff" stroke="#18243d" stroke-width="1.4"/>
    <text x="829" y="1484" font-size="12">否</text>
    <text x="618" y="1521" font-size="12">優先修正：</text>
    <line x1="693" y1="1524" x2="1065" y2="1524" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>
    <line x1="618" y1="1555" x2="1065" y2="1555" stroke="#647084" stroke-width="1.1" stroke-dasharray="6 5"/>
    </g>
  </g>
</svg>
