<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 1123 794" role="img" aria-label="城市創意節整合練習第2張，包含Web、App與互動狀態草圖欄">
  <rect width="1123" height="794" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#18243d">
    <text x="40" y="44" font-size="28" font-weight="800">城市創意節整合練習　第2張</text>
    <text x="1083" y="42" text-anchor="end" font-size="14">姓名：　　　　　　　　　日期：　　　　　　</text>
    <text x="40" y="68" font-size="13" fill="#4d586b">畫出主要內容與關鍵操作；每個互動狀態都要提供清楚的下一步。</text>

    <rect x="40" y="82" width="1043" height="34" rx="7" fill="#f7f4ee" stroke="#18243d" stroke-width="1.5"/>
    <text x="56" y="104" font-size="13" font-weight="700">共同主題：城市創意節　｜　同一組色彩、字級、間距與元件規則　｜　主要行動：</text>
    <line x1="778" y1="103" x2="1065" y2="103" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>

    <text x="40" y="138" font-size="17" font-weight="800">Web 首頁草圖</text>
    <text x="343" y="138" text-anchor="end" font-size="12" fill="#4d586b">80 × 155 mm</text>
    <rect x="40" y="148" width="303" height="586" fill="#ffffff" stroke="#18243d" stroke-width="2.4"/>
    <rect x="53" y="164" width="277" height="104" rx="5" fill="none" stroke="#aab0bb" stroke-width="1.2" stroke-dasharray="7 5"/>
    <text x="64" y="187" font-size="11" fill="#647084">Hero：一句價值＋主要行動</text>
    <rect x="53" y="283" width="277" height="86" rx="5" fill="none" stroke="#aab0bb" stroke-width="1.2" stroke-dasharray="7 5"/>
    <text x="64" y="306" font-size="11" fill="#647084">活動價值</text>
    <rect x="53" y="384" width="277" height="118" rx="5" fill="none" stroke="#aab0bb" stroke-width="1.2" stroke-dasharray="7 5"/>
    <text x="64" y="407" font-size="11" fill="#647084">參加流程</text>
    <rect x="53" y="517" width="277" height="82" rx="5" fill="none" stroke="#aab0bb" stroke-width="1.2" stroke-dasharray="7 5"/>
    <text x="64" y="540" font-size="11" fill="#647084">常見問題</text>
    <rect x="53" y="614" width="277" height="94" rx="5" fill="none" stroke="#aab0bb" stroke-width="1.2" stroke-dasharray="7 5"/>
    <text x="64" y="637" font-size="11" fill="#647084">最後 CTA</text>

    <text x="390" y="138" font-size="17" font-weight="800">App 關鍵流程</text>
    <text x="601" y="138" text-anchor="end" font-size="12" fill="#4d586b">每格 24 × 52 mm</text>
    <text x="390" y="169" font-size="12" font-weight="700">1　開始</text>
    <rect x="390" y="178" width="91" height="197" rx="8" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <line x1="418" y1="189" x2="453" y2="189" stroke="#18243d" stroke-width="3" stroke-linecap="round"/>
    <line x1="403" y1="219" x2="468" y2="219" stroke="#aab0bb" stroke-width="1.1" stroke-dasharray="5 4"/>
    <line x1="403" y1="250" x2="468" y2="250" stroke="#aab0bb" stroke-width="1.1" stroke-dasharray="5 4"/>
    <line x1="403" y1="281" x2="468" y2="281" stroke="#aab0bb" stroke-width="1.1" stroke-dasharray="5 4"/>
    <rect x="403" y="333" width="65" height="24" rx="4" fill="none" stroke="#647084" stroke-width="1.2"/>

    <text x="510" y="169" font-size="12" font-weight="700">2　選擇</text>
    <rect x="510" y="178" width="91" height="197" rx="8" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <line x1="538" y1="189" x2="573" y2="189" stroke="#18243d" stroke-width="3" stroke-linecap="round"/>
    <rect x="523" y="218" width="65" height="30" rx="4" fill="none" stroke="#aab0bb" stroke-width="1.2" stroke-dasharray="5 4"/>
    <rect x="523" y="260" width="65" height="30" rx="4" fill="none" stroke="#18243d" stroke-width="1.4"/>
    <rect x="523" y="302" width="65" height="30" rx="4" fill="none" stroke="#aab0bb" stroke-width="1.2" stroke-dasharray="5 4"/>

    <text x="390" y="411" font-size="12" font-weight="700">3　填寫／確認</text>
    <rect x="390" y="420" width="91" height="197" rx="8" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <line x1="418" y1="431" x2="453" y2="431" stroke="#18243d" stroke-width="3" stroke-linecap="round"/>
    <line x1="403" y1="464" x2="468" y2="464" stroke="#aab0bb" stroke-width="1.1" stroke-dasharray="5 4"/>
    <rect x="403" y="478" width="65" height="30" rx="4" fill="none" stroke="#647084" stroke-width="1.2"/>
    <line x1="403" y1="535" x2="468" y2="535" stroke="#aab0bb" stroke-width="1.1" stroke-dasharray="5 4"/>
    <rect x="403" y="575" width="65" height="24" rx="4" fill="none" stroke="#18243d" stroke-width="1.2"/>

    <text x="510" y="411" font-size="12" font-weight="700">4　結果／恢復</text>
    <rect x="510" y="420" width="91" height="197" rx="8" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <line x1="538" y1="431" x2="573" y2="431" stroke="#18243d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="555" cy="480" r="22" fill="none" stroke="#647084" stroke-width="1.4" stroke-dasharray="5 4"/>
    <line x1="523" y1="523" x2="588" y2="523" stroke="#aab0bb" stroke-width="1.1" stroke-dasharray="5 4"/>
    <line x1="523" y1="548" x2="588" y2="548" stroke="#aab0bb" stroke-width="1.1" stroke-dasharray="5 4"/>
    <rect x="523" y="575" width="65" height="24" rx="4" fill="none" stroke="#18243d" stroke-width="1.2"/>

    <rect x="640" y="148" width="443" height="166" rx="9" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <text x="658" y="176" font-size="17" font-weight="800">CTA 註記</text>
    <text x="658" y="204" font-size="12">按鈕文字：</text>
    <line x1="733" y1="207" x2="1063" y2="207" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="658" y="240" font-size="12">按下之後：</text>
    <line x1="733" y1="243" x2="1063" y2="243" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="658" y="276" font-size="12">成功條件：</text>
    <line x1="733" y1="279" x2="1063" y2="279" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>

    <rect x="640" y="334" width="443" height="166" rx="9" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <text x="658" y="362" font-size="17" font-weight="800">狀態與回饋註記</text>
    <text x="658" y="390" font-size="12">處理中：</text>
    <line x1="718" y1="393" x2="1063" y2="393" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="658" y="426" font-size="12">完成時：</text>
    <line x1="718" y1="429" x2="1063" y2="429" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="658" y="462" font-size="12">錯誤時：</text>
    <line x1="718" y1="465" x2="1063" y2="465" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>

    <rect x="640" y="520" width="443" height="166" rx="9" fill="#ffffff" stroke="#18243d" stroke-width="2"/>
    <text x="658" y="548" font-size="17" font-weight="800">返回方式註記</text>
    <text x="658" y="576" font-size="12">可返回哪一步：</text>
    <line x1="755" y1="579" x2="1063" y2="579" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="658" y="612" font-size="12">資料是否保留：</text>
    <line x1="755" y1="615" x2="1063" y2="615" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="658" y="648" font-size="12">再次操作提示：</text>
    <line x1="755" y1="651" x2="1063" y2="651" stroke="#647084" stroke-width="1.2" stroke-dasharray="6 5"/>

    <line x1="40" y1="752" x2="1083" y2="752" stroke="#18243d" stroke-width="1"/>
    <text x="40" y="776" font-size="12">完成標準：Web 閱讀順序清楚；App 每一步有目的；錯誤發生後仍能繼續完成任務。</text>
    <text x="1083" y="776" text-anchor="end" font-size="12" font-weight="700">設計入門｜整合練習</text>
  </g>
</svg>
