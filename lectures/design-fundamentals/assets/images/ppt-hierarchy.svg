<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="簡報資訊層級改版前後對照">
  <rect width="1200" height="700" fill="#f7f4ee"/>
  <text x="70" y="68" fill="#18243d" font-family="system-ui, sans-serif" font-size="34" font-weight="700">PPT 設計：一頁只傳達一個結論</text>

  <rect x="70" y="105" width="500" height="420" rx="18" fill="#ffffff" stroke="#d8d4cc" stroke-width="2"/>
  <rect x="70" y="105" width="500" height="52" rx="18" fill="#ff7657"/>
  <rect x="70" y="135" width="500" height="22" fill="#ff7657"/>
  <text x="95" y="139" fill="#ffffff" font-family="system-ui, sans-serif" font-size="23" font-weight="700">改版前：內容很多，結論不見了</text>
  <text x="98" y="197" fill="#18243d" font-family="system-ui, sans-serif" font-size="23" font-weight="700">第三季專案成果報告</text>
  <g fill="#6d7480">
    <rect x="98" y="220" width="424" height="8" rx="4"/>
    <rect x="98" y="240" width="390" height="8" rx="4"/>
    <rect x="98" y="260" width="433" height="8" rx="4"/>
    <rect x="98" y="280" width="350" height="8" rx="4"/>
    <rect x="98" y="300" width="412" height="8" rx="4"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#18243d">
    <rect x="98" y="335" width="130" height="94" rx="8" fill="#e8eefc"/>
    <text x="163" y="374" font-size="24" font-weight="800">42%</text>
    <text x="163" y="406" font-size="17">成長率</text>
    <rect x="245" y="335" width="130" height="94" rx="8" fill="#e8eefc"/>
    <text x="310" y="374" font-size="24" font-weight="800">1,280</text>
    <text x="310" y="406" font-size="17">新用戶</text>
    <rect x="392" y="335" width="130" height="94" rx="8" fill="#e8eefc"/>
    <text x="457" y="374" font-size="24" font-weight="800">86%</text>
    <text x="457" y="406" font-size="17">滿意度</text>
  </g>
  <g fill="#8f96a1">
    <rect x="98" y="454" width="418" height="7" rx="4"/>
    <rect x="98" y="473" width="384" height="7" rx="4"/>
    <rect x="98" y="492" width="426" height="7" rx="4"/>
  </g>

  <rect x="630" y="105" width="500" height="420" rx="18" fill="#18243d"/>
  <rect x="630" y="105" width="500" height="52" rx="18" fill="#29a36a"/>
  <rect x="630" y="135" width="500" height="22" fill="#29a36a"/>
  <text x="655" y="139" fill="#ffffff" font-family="system-ui, sans-serif" font-size="23" font-weight="700">改版後：先說結論，再給證據</text>
  <text x="670" y="209" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="750">簡化報名流程後，</text>
  <text x="670" y="250" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="750">完成率明顯提升</text>
  <text x="670" y="338" fill="#ff7657" font-family="system-ui, sans-serif" font-size="76" font-weight="850">+42%</text>
  <text x="916" y="318" fill="#c9d6f5" font-family="system-ui, sans-serif" font-size="20">第三季報名</text>
  <text x="916" y="347" fill="#c9d6f5" font-family="system-ui, sans-serif" font-size="20">完成率成長</text>
  <g font-family="system-ui, sans-serif" font-size="18">
    <circle cx="682" cy="408" r="10" fill="#29a36a"/>
    <text x="705" y="415" fill="#ffffff">欄位由 8 個減至 4 個</text>
    <circle cx="682" cy="450" r="10" fill="#356df3"/>
    <text x="705" y="457" fill="#ffffff">行動版完成時間減少 35%</text>
    <circle cx="682" cy="492" r="10" fill="#ff7657"/>
    <text x="705" y="499" fill="#ffffff">錯誤提示更靠近問題欄位</text>
  </g>

  <line x1="165" y1="583" x2="1034" y2="583" stroke="#c9c4ba" stroke-width="4"/>
  <polygon points="1034,583 1010,569 1010,597" fill="#356df3"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <circle cx="190" cy="583" r="34" fill="#ff7657"/>
    <text x="190" y="591" fill="#ffffff" font-size="23" font-weight="800">1</text>
    <text x="190" y="642" fill="#18243d" font-size="20" font-weight="700">刪除雜訊</text>
    <circle cx="500" cy="583" r="34" fill="#356df3"/>
    <text x="500" y="591" fill="#ffffff" font-size="23" font-weight="800">2</text>
    <text x="500" y="642" fill="#18243d" font-size="20" font-weight="700">放大結論</text>
    <circle cx="810" cy="583" r="34" fill="#29a36a"/>
    <text x="810" y="591" fill="#ffffff" font-size="23" font-weight="800">3</text>
    <text x="810" y="642" fill="#18243d" font-size="20" font-weight="700">保留三個證據</text>
  </g>
</svg>
