<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="App 場地預約四步流程與名額保留及可恢復錯誤狀態">
  <rect width="1200" height="700" fill="#f7f4ee"/>
  <text x="70" y="66" fill="#18243d" font-family="system-ui, sans-serif" font-size="34" font-weight="700">App 預約流程：每一步只做一件事</text>

  <line x1="150" y1="126" x2="750" y2="126" stroke="#c9c4ba" stroke-width="5"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <circle cx="150" cy="126" r="28" fill="#356df3"/>
    <text x="150" y="134" fill="#ffffff" font-size="20" font-weight="800">1</text>
    <text x="150" y="174" fill="#18243d" font-size="18" font-weight="700">選日期</text>
    <circle cx="350" cy="126" r="28" fill="#356df3"/>
    <text x="350" y="134" fill="#ffffff" font-size="20" font-weight="800">2</text>
    <text x="350" y="174" fill="#18243d" font-size="18" font-weight="700">選時段</text>
    <circle cx="550" cy="126" r="28" fill="#356df3"/>
    <text x="550" y="134" fill="#ffffff" font-size="20" font-weight="800">3</text>
    <text x="550" y="174" fill="#18243d" font-size="18" font-weight="700">填資料</text>
    <circle cx="750" cy="126" r="28" fill="#17633f"/>
    <text x="750" y="134" fill="#ffffff" font-size="20" font-weight="800">4</text>
    <text x="750" y="174" fill="#18243d" font-size="18" font-weight="700">確認</text>
  </g>

  <g font-family="system-ui, sans-serif">
    <rect x="70" y="210" width="190" height="350" rx="26" fill="#ffffff" stroke="#18243d" stroke-width="3"/>
    <rect x="128" y="225" width="74" height="7" rx="4" fill="#18243d"/>
    <text x="94" y="273" fill="#18243d" font-size="21" font-weight="800">選擇日期</text>
    <text x="94" y="307" fill="#6d7480" font-size="16">2026 年 10 月</text>
    <rect x="94" y="325" width="142" height="40" rx="9" fill="#356df3"/>
    <text x="165" y="351" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">10/17　六</text>
    <rect x="94" y="377" width="142" height="40" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="2"/>
    <text x="165" y="403" text-anchor="middle" fill="#18243d" font-size="16">10/18　日</text>
    <rect x="94" y="429" width="142" height="40" rx="9" fill="#ffffff" stroke="#d8d4cc" stroke-width="2"/>
    <text x="165" y="455" text-anchor="middle" fill="#18243d" font-size="16">10/24　六</text>
    <rect x="94" y="490" width="142" height="42" rx="10" fill="#356df3"/>
    <text x="165" y="518" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">選擇時段</text>

    <rect x="280" y="210" width="190" height="350" rx="26" fill="#ffffff" stroke="#18243d" stroke-width="3"/>
    <rect x="338" y="225" width="74" height="7" rx="4" fill="#18243d"/>
    <text x="304" y="273" fill="#18243d" font-size="21" font-weight="800">選擇時段</text>
    <rect x="304" y="304" width="142" height="48" rx="10" fill="#ffffff" stroke="#d8d4cc" stroke-width="2"/>
    <text x="375" y="334" text-anchor="middle" fill="#18243d" font-size="16">09:00–11:00</text>
    <rect x="304" y="364" width="142" height="54" rx="10" fill="#f7f4ee" stroke="#8d3521" stroke-width="2"/>
    <text x="375" y="386" text-anchor="middle" fill="#18243d" font-size="15">11:30–13:30</text>
    <text x="375" y="407" text-anchor="middle" fill="#8d3521" font-size="14" font-weight="700">已額滿</text>
    <rect x="304" y="430" width="142" height="44" rx="10" fill="#356df3"/>
    <text x="375" y="459" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">14:00–16:00</text>
    <rect x="304" y="490" width="142" height="42" rx="10" fill="#356df3"/>
    <text x="375" y="518" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">填寫資料</text>

    <rect x="490" y="210" width="190" height="350" rx="26" fill="#ffffff" stroke="#18243d" stroke-width="3"/>
    <rect x="548" y="225" width="74" height="7" rx="4" fill="#18243d"/>
    <text x="514" y="273" fill="#18243d" font-size="21" font-weight="800">聯絡資料</text>
    <text x="514" y="310" fill="#6d7480" font-size="15">姓名</text>
    <rect x="514" y="321" width="142" height="40" rx="8" fill="#ffffff" stroke="#356df3" stroke-width="2"/>
    <text x="526" y="347" fill="#18243d" font-size="16">陳同學</text>
    <text x="514" y="391" fill="#6d7480" font-size="15">電子郵件</text>
    <rect x="514" y="402" width="142" height="40" rx="8" fill="#ffffff" stroke="#8d3521" stroke-width="2"/>
    <text x="526" y="428" fill="#6d7480" font-size="15">name@example</text>
    <text x="514" y="466" fill="#a43820" font-size="14" font-weight="700">請輸入完整郵件地址</text>
    <rect x="514" y="490" width="142" height="42" rx="10" fill="#356df3"/>
    <text x="585" y="518" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">檢查預約</text>

    <rect x="700" y="210" width="190" height="350" rx="26" fill="#ffffff" stroke="#18243d" stroke-width="3"/>
    <rect x="758" y="225" width="74" height="7" rx="4" fill="#18243d"/>
    <text x="724" y="273" fill="#18243d" font-size="21" font-weight="800">確認預約</text>
    <rect x="724" y="306" width="142" height="132" rx="12" fill="#e8eefc"/>
    <text x="740" y="334" fill="#18243d" font-size="15" font-weight="700">多功能室 A</text>
    <text x="740" y="364" fill="#18243d" font-size="16">10 月 17 日</text>
    <text x="740" y="394" fill="#18243d" font-size="16">14:00–16:00</text>
    <text x="740" y="424" fill="#18243d" font-size="16" font-weight="700">300 元</text>
    <rect x="724" y="463" width="142" height="50" rx="10" fill="#17633f"/>
    <text x="795" y="495" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800">保留名額</text>
  </g>

  <g font-family="system-ui, sans-serif">
    <rect x="925" y="210" width="220" height="150" rx="18" fill="#e1f4eb" stroke="#17633f" stroke-width="3"/>
    <circle cx="960" cy="252" r="18" fill="#17633f"/>
    <path d="M951 252l7 7 13-16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="990" y="260" fill="#17633f" font-size="22" font-weight="800">名額已保留</text>
    <text x="950" y="303" fill="#18243d" font-size="17">請於 14:40 前付款</text>
    <rect x="950" y="317" width="170" height="28" rx="8" fill="#17633f"/>
    <text x="1035" y="337" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">前往付款</text>
    <rect x="925" y="392" width="220" height="168" rx="18" fill="#fff1ed" stroke="#8d3521" stroke-width="3"/>
    <circle cx="960" cy="434" r="18" fill="#8d3521"/>
    <path d="M960 424v15m0 8v1" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="990" y="442" fill="#8d3521" font-size="22" font-weight="800">時段剛額滿</text>
    <text x="950" y="486" fill="#18243d" font-size="17">請重新選擇可用時段</text>
    <rect x="950" y="511" width="170" height="30" rx="8" fill="#ff7657"/>
    <text x="1035" y="532" text-anchor="middle" fill="#18243d" font-size="15" font-weight="800">返回選時段</text>
  </g>
  <text x="600" y="634" text-anchor="middle" fill="#18243d" font-family="system-ui, sans-serif" font-size="21" font-weight="700">清楚進度、即時驗證、名額保留與錯誤都有下一步</text>
</svg>
