  <text x="422" y="598" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="19" font-weight="700">現在立即報名參加</text>

  <rect x="630" y="102" width="500" height="528" rx="24" fill="#18243d"/>
  <rect x="630" y="102" width="500" height="58" rx="24" fill="#17633f"/>
  <rect x="630" y="136" width="500" height="24" fill="#17633f"/>
  <text x="658" y="141" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="700">改版後：先看重點，再採取行動</text>
