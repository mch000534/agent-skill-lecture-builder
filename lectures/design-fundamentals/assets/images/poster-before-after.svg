  <text x="674" y="421" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="650">10 月 18 日　14:00</text>
  <text x="674" y="459" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24">文化中心三樓</text>
  <text x="674" y="499" fill="#c9d6f5" font-family="system-ui, sans-serif" font-size="20">主講人：林老師｜免費入場</text>
  <rect x="674" y="542" width="232" height="58" rx="12" fill="#ff7657"/>
  <text x="790" y="579" text-anchor="middle" fill="#18243d" font-family="system-ui, sans-serif" font-size="22" font-weight="800">立即報名</text>
  <rect x="1012" y="542" width="74" height="58" rx="8" fill="#ffffff"/>
  <path d="M1025 553h18v18h-18zm28 0h20v20h-20zm-28 29h20v9h-20zm29 0h8v8h-8zm13 0h7v17h-18v-7h11z" fill="#18243d"/>

