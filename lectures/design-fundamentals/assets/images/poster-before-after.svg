  <rect x="70" y="102" width="500" height="528" rx="24" fill="#ffffff" stroke="#d8d4cc" stroke-width="2"/>
  <rect x="70" y="102" width="500" height="58" rx="24" fill="#ff7657"/>
  <rect x="70" y="136" width="500" height="24" fill="#ff7657"/>
